# Keeps the Nupp manifest current. The bootstrap step creates it from the first
# published release; after that, Scoop's Excavator performs normal checkver and
# autoupdate processing.
name: Excavator

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: write

concurrency:
  group: excavator
  cancel-in-progress: false

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Check out the bucket
        uses: actions/checkout@v6

      - name: Bootstrap the first Nupp manifest
        id: bootstrap
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/bootstrap-manifest.sh

      - name: Validate the bootstrapped manifest
        if: steps.bootstrap.outputs.created == 'true'
        shell: bash
        run: jq empty bucket/nupp.json

      - name: Commit the first manifest
        if: steps.bootstrap.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version bucket/nupp.json)
          test -n "$version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/nupp.json
          git commit -m "Add Nupp $version"
          git push

      - name: Excavate
        if: hashFiles('bucket/nupp.json') != ''
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_UPDATED: 1
